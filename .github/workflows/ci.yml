name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# O CI nunca fala com a fonte de mercado: usa o provider de fixture, que é dado
# real capturado e versionado. Assim o build não depende de terceiro, não gasta
# cota e não precisa de credencial.
env:
  MARKET_PROVIDER: fixture

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - name: Token contrast audit
        run: npx playwright install --with-deps chromium && npm run contrast
      - run: npm run build
      - name: Bundle budget
        run: npm run budget
      - name: Credential scan on the client bundle
        run: npm run token-scan

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
